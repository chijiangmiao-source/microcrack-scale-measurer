services:
  web:
    build:
      context: .
      target: web
    ports:
      - "${WEB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 2s

  # 一次性验收服务：跑完 Vitest + Playwright 即退出
  verify:
    build:
      context: .
      target: verify
    depends_on:
      web:
        condition: service_healthy
    environment:
      E2E_BASE_URL: http://web
      CI: "true"
